name: Build & Attach .deb

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    # Build a native .deb per architecture. build-deb.sh derives the arch from
    # `dpkg --print-architecture`, so each runner produces the right package.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build .deb
        run: bash installer/scripts/build-deb.sh "${{ github.event.release.tag_name }}"

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
